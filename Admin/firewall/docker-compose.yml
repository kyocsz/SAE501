services:
  firewall:
    build: .
    container_name: firewall
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      users-network:
        ipv4_address: 192.168.10.1
      services-network:
        ipv4_address: 192.168.20.1
      admin-network:
        ipv4_address: 192.168.30.1
    volumes:
      - ./nftables.conf:/etc/nftables.conf:ro
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.forwarding=1

networks:
  admin-network:
    external: true
  services-network:
    external: true
  users-network:
    external: true
