services:
  firewall:
    build: .
    container_name: firewall
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    logging:
      driver: "syslog"
      options:
        syslog-address: "udp://192.168.30.20:514"
        tag: "firewall"
    networks:
      admin-network:
        ipv4_address: 192.168.30.254
      services-network:
        ipv4_address: 192.168.20.254
      users-network:
        ipv4_address: 192.168.10.254
    volumes:
      - ./nftables.conf:/etc/nftables.conf:ro
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.forwarding=1

networks:
  admin-network:
    external: true
  services-network:
    external: true
  users-network:
    external: true
