#!/usr/sbin/nft -f

flush ruleset

define IF_ADMIN    = eth0
define IF_SERVERS  = eth1
define IF_USERS    = eth2

define NET_ADMIN    = 192.168.30.0/24
define NET_SERVERS  = 192.168.20.0/24
define NET_USERS    = 192.168.10.0/24

table inet filter {

    chain input {
        type filter hook input priority 0; policy drop;

        iif "lo" accept
        ct state established,related accept
        icmp type echo-request accept
        ip6 nexthdr icmpv6 accept

        iifname $IF_ADMIN tcp dport { 22, 443 } accept

        udp dport 53 accept
        tcp dport 53 accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;

        ct state established,related accept
        ct state invalid drop

        iifname $IF_ADMIN accept

        iifname $IF_USERS oifname $IF_SERVERS accept

        iifname $IF_SERVERS oifname $IF_USERS log prefix "BLOCKED-SERVERS-TO-USERS " drop

        iifname $IF_USERS oifname $IF_ADMIN log prefix "BLOCKED-USERS-TO-ADMIN " drop

        iifname $IF_SERVERS oifname $IF_ADMIN log prefix "BLOCKED-SERVERS-TO-ADMIN " drop
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
