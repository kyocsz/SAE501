#!/usr/sbin/nft -f

flush ruleset

### Variables ###

define INTERFACE_ADMIN    = eth0
define INTERFACE_SERVICES = eth1
define INTERFACE_USERS    = eth2

define NETWORK_ADMIN    = 192.168.30.0/24
define NETWORK_SERVICES = 192.168.20.0/24
define NETWORK_USERS    = 192.168.10.0/24

define IP_RSYSLOG   = 192.168.30.20

### Tables ###

table inet filter {

    ### Sets ###

    set SERVICES_AUTORISES {
        type ipv4_addr . inet_service
        elements = {
            192.168.20.10 . 5000,    # Page web
            192.168.20.40 . 80,    # Filebrowser
        }
    }

    ### Input

    chain input {
        type filter hook input priority 0; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        icmp type echo-request accept
        ip6 nexthdr icmpv6 accept

        iifname $INTERFACE_ADMIN tcp dport { 22, 443 } accept

        udp dport 53 accept
        tcp dport 53 accept
    }

    ### Forward

    chain forward {
        type filter hook forward priority 0; policy drop;

        ct state established,related accept
        ct state invalid drop

        iifname $INTERFACE_ADMIN accept

        iifname $INTERFACE_USERS oifname $INTERFACE_SERVICES ip daddr . tcp dport @SERVICES_AUTORISES accept

        iifname $INTERFACE_SERVICES oifname $INTERFACE_ADMIN ip daddr $IP_RSYSLOG udp dport 514 accept
        iifname $INTERFACE_SERVICES oifname $INTERFACE_ADMIN ip daddr $IP_RSYSLOG tcp dport 514 accept

        iifname $INTERFACE_SERVICES oifname $INTERFACE_USERS log prefix "BLOCKED-SERVICES-TO-USERS " drop
        iifname $INTERFACE_USERS oifname $INTERFACE_SERVICES log prefix "BLOCKED-USERS-TO-SERVICES " drop
        iifname $INTERFACE_USERS oifname $INTERFACE_ADMIN log prefix "BLOCKED-USERS-TO-ADMIN " drop
        iifname $INTERFACE_SERVICES oifname $INTERFACE_ADMIN log prefix "BLOCKED-SERVICES-TO-ADMIN " drop
    }

    ### Output

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
