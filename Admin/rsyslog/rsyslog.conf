# Modules
module(load="imuxsock")
module(load="imklog")
module(load="imudp")
input(type="imudp" port="514")
module(load="imtcp")
input(type="imtcp" port="514")

$ActionFileDefaultTemplate RSYSLOG_TraditionalFileFormat

$template ServiceDailyLog,"/var/log/remote/%programname%/%$YEAR%-%$MONTH%-%$DAY%.log"

*.* ?ServiceDailyLog
& stop
