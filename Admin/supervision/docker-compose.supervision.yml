version: "3.9"

# Ce fichier ne décrit QUE la supervision. À fusionner plus tard avec
# les autres blocs "services:" dans un seul docker-compose.yml global,
# en gardant une seule définition du réseau "admin".

services:
  portainer:
    image: portainer/portainer-ce:2.39.5
    container_name: portainer
    hostname: portainer
    restart: unless-stopped

    # Accès en lecture/écriture au socket Docker du host : c'est ce qui
    # lui permet de voir tous les conteneurs (actifs/arrêtés), leur
    # conso CPU/RAM en direct, leurs logs et leurs événements, sans
    # config à écrire nulle part.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

    networks:
      admin:
        ipv4_address: 192.168.30.20

    # Pas de "ports:" par défaut -> accessible uniquement depuis le
    # réseau "admin" (ex: depuis le conteneur Admin). Décommente pour
    # tester depuis ton PC pendant le dev :
    # ports:
    #   - "9443:9443"

networks:
  admin:
    name: admin
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.30.0/24
          gateway: 192.168.30.1

volumes:
  portainer_data:
