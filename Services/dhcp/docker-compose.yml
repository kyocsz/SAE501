version: "3.9"

services:
  dhcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: dnsmasq-dhcp:custom
    container_name: dhcp
    hostname: dhcp
    logging:
      driver: "syslog"
      options:
        syslog-address: "udp://192.168.30.20:514"
        tag: "dhcp"
    restart: unless-stopped

    cap_add:
      - NET_ADMIN

    networks:
      services-network:
        ipv4_address: 192.168.20.30

    volumes:
      - ./dnsmasq.conf:/etc/dnsmasq.conf:ro

    ports:
      - "67:67/udp"

networks:
  services-network:
    external: true
