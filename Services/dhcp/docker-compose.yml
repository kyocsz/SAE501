version: "3.9"

services:
  dhcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: dnsmasq-dhcp:custom
    container_name: dhcp
    hostname: dhcp
    restart: unless-stopped

    cap_add:
      - NET_ADMIN

    networks:
      services-network:
        ipv4_address: 192.168.20.30

    volumes:
      - ./dnsmasq.conf:/etc/dnsmasq.conf:ro

    ports:
      - "67:67/udp"

networks:
  services-network:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.20.0/24
          gateway: 192.168.20.1
