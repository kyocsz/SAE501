services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./Files:/srv
      - ./filebrowser.db:/database/filebrowser.db
      - ./filebrowser.json:/.filebrowser.json
    environment:
      - PUID=1000
      - PGID=1000
    networks:
      services-network:
        ipv4_address: 192.168.20.40

networks:
  services-network:
    external: true
