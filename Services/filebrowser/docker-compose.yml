services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    volumes:
      - ./Files:/srv
      - ./filebrowser.db:/database/filebrowser.db
      - ./filebrowser.json:/.filebrowser.json
    environment:
      - PUID=1000
      - PGID=1000
    logging:
      driver: syslog
      options:
        syslog-address: "udp://192.168.30.20:514"
        tag: "filebrowser"
    networks:
      services-network:
        ipv4_address: 192.168.20.40

networks:
  services-network:
    external: true
