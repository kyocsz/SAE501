services:
  web:
    build: .
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=development
    logging:
      driver: syslog
      options:
        syslog-address: "udp://192.168.30.20:514"
        tag: "web"
    networks:
      services-network:
        ipv4_address: 192.168.20.10

networks:
  services-network:
    external: true
