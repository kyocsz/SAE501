services:
  web:
    build: .
    container_name: web-web-1
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    command: >
      sh -c "ip route replace 192.168.10.0/24 via 192.168.20.254 &&
             ip route replace 192.168.30.0/24 via 192.168.20.254 &&
             exec python app.py"
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=development
      - PYTHONUNBUFFERED=1
    logging:
      driver: syslog
      options:
        syslog-address: "udp://192.168.30.20:514"
        tag: "web"
    networks:
      services-network:
        ipv4_address: 192.168.20.10

networks:
  services-network:
    external: true
